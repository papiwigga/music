name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        run: |
          cmake --build build --config Release --target AfinaVST_VST3
          cmake --build build --config Release --target AfinaVST_Standalone

      - uses: actions/upload-artifact@v4
        with:
          name: AfinaVST-Windows
          path: |
            build/AfinaVST_artefacts/Release/VST3/AfinaVST.vst3
            build/AfinaVST_artefacts/Release/Standalone/AfinaVST.exe
