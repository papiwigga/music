name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AfinaVST_VST3

      - name: Build Standalone
        run: cmake --build build --config Release --target AfinaVST_Standalone

      - name: Show result
        if: always()
        run: Get-ChildItem -Recurse build/AfinaVST_artefacts | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: AfinaVST-Windows
          path: build/AfinaVST_artefacts/Release
          if-no-files-found: error
